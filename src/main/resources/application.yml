# ==========================================
# Order Service Configuration
# ==========================================
server:
  port: 8082

spring:
  application:
    name: order-service

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # H2 Console (access at http://localhost:8082/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Re-enable trailing slash matching (disabled by default in Spring Boot 3)
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# ==========================================
# Product Service URL
# Both Feign Client and WebClient use this
# ==========================================
product:
  service:
    url: http://localhost:8081

# Logging
logging:
  level:
    com.example.orderservice: DEBUG
